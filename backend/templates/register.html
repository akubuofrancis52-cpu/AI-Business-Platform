{% extends "base.html" %}

{% block title %}
Register
{% endblock %}

{% block content %}

<h2>Create Account</h2>

<form method="POST">

    <div class="mb-3">
        <label>Username</label>
        <input
            type="text"
            class="form-control"
            name="username"
            required>
    </div>

    <div class="mb-3">
        <label>Email</label>
        <input
            type="email"
            class="form-control"
            name="email"
            required>
    </div>

    <div class="mb-3">
        <label>Password</label>
        <input
            type="password"
            class="form-control"
            name="password"
            required>
    </div>

    <button class="btn btn-success">
        Register
    </button>

<label>Preferred Language</label>

<select name="language" class="form-control">

<option value="English">
English
</option>

<option value="French">
Français
</option>

<option value="Spanish">
Español
</option>

</select>

<br>

</form>

{% endblock %}
