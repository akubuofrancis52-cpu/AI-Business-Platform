{% extends "base.html" %}

{% block title %}
Add Menu Item
{% endblock %}

{% block content %}

<div class="container mt-5">

    <h1>Add Menu Item</h1>

    <p><strong>{{ business.name }}</strong></p>

    <hr>

    <form method="POST">

        <div class="mb-3">
            <label>Item Name</label>
            <input
                type="text"
                name="name"
                class="form-control"
                required>
        </div>

        <div class="mb-3">
            <label>Description</label>
            <textarea
                name="description"
                class="form-control"></textarea>
        </div>

        <div class="mb-3">
            <label>Price</label>
            <input
                type="number"
                step="0.01"
                name="price"
                class="form-control"
                required>
        </div>

        <div class="mb-3">
            <label>Category</label>
            <input
                type="text"
                name="category"
                class="form-control">
        </div>

        <button class="btn btn-success">
            Save Menu Item
        </button>

        <a href="/business/{{ business.id }}"
           class="btn btn-secondary">
            Cancel
        </a>

    </form>

</div>

{% endblock %}
