{% extends "base.html" %}

{% block title %}Edit Menu Item • Botify{% endblock %}

{% block content %}
<section class="creation-page">
    <div class="creation-shell auth-wide">
        <div class="creation-hero glass-deep shadow-float">
            <span class="eyebrow-pill centered">
                <span class="eyebrow-dot peach"></span>
                Menu management
            </span>
            <h1>Edit your menu item.</h1>
            <p>Keep the details accurate so your team and AI assistant always work from the right menu.</p>
        </div>

        <div class="form-panel glass shadow-soft">
            <div class="form-panel-head">
                <div>
                    <span class="eyebrow-pill">
                        <span class="eyebrow-dot sky"></span>
                        Menu item
                    </span>
                    <h2>{{ menu.name }}</h2>
                </div>
                <a href="/business/{{ menu.business_id }}" class="btn-glass">← Dashboard</a>
            </div>

            <form method="POST" class="premium-form">
                <div class="form-grid-2">
                    <div class="field-group field-floating">
                        <input id="name" type="text" name="name" placeholder=" " value="{{ menu.name }}" required>
                        <label for="name">Item name</label>
                    </div>
                    <div class="field-group field-floating">
                        <input id="category" type="text" name="category" placeholder=" " value="{{ menu.category or '' }}">
                        <label for="category">Category</label>
                    </div>
                </div>

                <div class="form-grid-2">
                    <div class="field-group field-floating">
                        <input id="price" type="number" step="0.01" min="0" name="price" placeholder=" " value="{{ menu.price }}" required>
                        <label for="price">Price (FCFA)</label>
                    </div>
                    <div class="field-group">
                        <label class="form-label" for="description">Description</label>
                        <textarea id="description" name="description" rows="4" placeholder="Describe this menu item">{{ menu.description or '' }}</textarea>
                    </div>
                </div>

                <div class="form-actions">
                    <a href="/business/{{ menu.business_id }}" class="btn-glass">Cancel</a>
                    <button type="submit" class="btn-dark magnetic-target">
                        <span>Save changes</span><b>↗</b>
                    </button>
                </div>
            </form>
        </div>
    </div>
</section>
{% endblock %}
