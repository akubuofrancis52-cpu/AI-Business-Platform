<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
{% block title %}
AI Business Platform
{% endblock %}
</title>



<style>

body {

font-family:
-apple-system,
BlinkMacSystemFont,
"SF Pro Display",
"SF Pro Text",
"Helvetica Neue",
Arial,
sans-serif;

}

</style>



<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">


{% block extra_css %}
{% endblock %}


</head>



<body>




<!-- Animated Background -->

<div class="background">

<div class="floating-circle circle-one"></div>

<div class="floating-circle circle-two"></div>

<div class="floating-circle circle-three"></div>

</div>






<!-- Premium Apple Style Navigation -->

<nav class="navbar">

<div class="nav-container">



<!-- LEFT SIDE -->

<div class="nav-left">



<a href="/" class="brand">


<div class="brand-icon">

🤖

</div>



<div class="brand-text">

AI Business

<span>
Platform
</span>

</div>


</a>





<a href="/" class="apple-nav-btn">

⌂ Home

</a>






{% if not session.get("user_id") %}



<a href="/login" class="apple-nav-btn">

Login

</a>




<a href="/register" class="apple-nav-btn primary">

Get Started

</a>



{% endif %}



</div>







<!-- RIGHT SIDE -->

<div class="nav-right">



{% if session.get("user_id") %}



<a href="/dashboard" class="apple-nav-btn">

▣ Dashboard

</a>





<a href="/logout" class="apple-nav-btn danger">

↪ Logout

</a>



{% endif %}



</div>



</div>

</nav>








<!-- MAIN CONTENT -->

<main class="page-content">


{% block content %}

{% endblock %}


</main>







<!-- LOADER -->

<div id="loader" class="loader hidden">


<div class="loader-circle"></div>


</div>








<script>


function showLoader(){


const loader=document.getElementById("loader");


if(loader){

loader.classList.remove("hidden");

}


}



</script>






{% block scripts %}

{% endblock %}



</body>


</html>
