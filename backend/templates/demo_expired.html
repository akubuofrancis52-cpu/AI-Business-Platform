<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Botify AI — Demo Expired
    </title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            min-height: 100vh;

            display: grid;

            place-items: center;

            padding: 24px;

            font-family:
                Inter,
                system-ui,
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #fff1e8,
                    #f6f8fb,
                    #eaf3ff
                );

            color:
                #111827;
        }

        .card {

            width:
                min(500px, 100%);

            padding:
                40px;

            border-radius:
                28px;

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.88
                );

            border:
                1px solid
                rgba(
                    255,
                    255,
                    255,
                    0.95
                );

            box-shadow:
                0
                30px
                70px
                rgba(
                    15,
                    23,
                    42,
                    0.12
                );

            text-align:
                center;
        }

        .mark {

            width:
                52px;

            height:
                52px;

            margin:
                0
                auto
                20px;

            display:
                grid;

            place-items:
                center;

            border-radius:
                17px;

            background:
                #111827;

            color:
                white;

            font-weight:
                900;

            font-size:
                20px;
        }

        h1 {

            margin:
                0
                0
                10px;

            font-size:
                32px;

            letter-spacing:
                -1px;
        }

        p {

            margin:
                0;

            color:
                #687385;

            line-height:
                1.65;
        }

    </style>

</head>

<body>

<div class="card">

    <div class="mark">
        B
    </div>

    <h1>
        Demo trial expired
    </h1>

    <p>
        This Botify AI demonstration is no longer
        available. Please contact us to request
        a new trial.
    </p>

</div>

</body>
</html>
