{% extends "base.html" %}

{% block title %}
Create Order
{% endblock %}

{% block content %}

<div class="container mt-5">

    <h1>Create New Order</h1>

    <p><strong>{{ business.name }}</strong></p>

    <hr>

    <form method="POST">

        <div class="mb-3">
            <label>Customer Name</label>
            <input
                type="text"
                name="customer_name"
                class="form-control"
                required>
        </div>

        <div class="mb-3">
            <label>Customer Phone</label>
            <input
                type="text"
                name="customer_phone"
                class="form-control">
        </div>

        <div class="mb-3">
            <label>Delivery Address</label>
            <textarea
                name="delivery_address"
                class="form-control"></textarea>
        </div>

        <div class="mb-3">
            <label>Total Price</label>
            <input
                type="number"
                step="0.01"
                name="total_price"
                class="form-control"
                required>
        </div>

        <button class="btn btn-success">
            Create Order
        </button>

        <a href="/business/{{ business.id }}/orders"
           class="btn btn-secondary">
            Cancel
        </a>

    </form>

</div>

{% endblock %}
